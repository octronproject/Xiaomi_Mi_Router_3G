name: Build OpenWrt 25.12.5 MT7621 Hardmod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Your Repository
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo docker rmi $(docker image ls -q) 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y purge azure-cli google-cloud-cli google-chrome-stable firefox powershell dotnet-sdk*
        sudo -E apt-get update
        sudo -E apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev libxml-parser-perl device-tree-compiler \
          quilt rsync unzip zlib1g-dev file wget python3-distutils python3-setuptools
        sudo -E apt-get autoremove --purge -y
        sudo -E apt-get clean

    - name: Clone OpenWrt Source & Checkout Tag
      run: |
        git clone https://github.com openwrt
        cd openwrt
        git pull
        git checkout v25.12.5
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply Hardmod Fixes (Overwrite DTS & MK)
      run: |
        if [ -d "patch-custom" ]; then
          find patch-custom/ -name "*.dts" -exec cp -f {} openwrt/target/linux/ramips/dts/ \;
          echo "DTS files successfully replaced!"
        fi
        
        if [ -f "patch-custom/mt7621.mk" ]; then
          cp -f patch-custom/mt7621.mk openwrt/target/linux/ramips/image/
          echo "Makefile (mt7621.mk) successfully replaced!"
        fi

    - name: Generate Config for MT7621
      run: |
        cd openwrt
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
        
        if [ -f "../.config" ]; then
          cat ../.config >> .config
        fi
        
        make defconfig

    - name: Download Package Source (Pre-download)
      run: |
        cd openwrt
        # Mendownload semua dependensi dan source paket sekaligus di awal
        make download -j8
        # Menampilkan file yang gagal didownload jika ada (opsional untuk mempermudah tracking)
        find dl -size 0 -exec rm -f {} \;

    - name: Compile Toolchain & Firmware
      run: |
        cd openwrt
        make -j $(nproc) download world

    - name: Organize Files
      id: organize
      run: |
        cd openwrt/bin/targets/ramips/mt7621
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_25.12.5_MT7621_Hardmod
        path: ${{ env.FIRMWARE_PATH }}/*
